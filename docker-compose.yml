services:
  desk:
    build: .
    ports: ["8501:8501"]
    volumes: ["./calls.db:/app/calls.db"]
  api:
    build: .
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
  landing:
    image: nginx:alpine
    volumes: ["./landing:/usr/share/nginx/html:ro"]
    ports: ["8080:80"]
